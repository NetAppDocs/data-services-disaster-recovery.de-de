indexpage:
  title: NetApp Disaster Recovery -Dokumentation
  summary: Mit NetApp Disaster Recovery können Sie Ihre lokalen VMware- und Kubernetes-Workloads,
    die auf ONTAP Storage ausgeführt werden, an einen Disaster Recovery Standort replizieren.
  keywords: disaster, disaster recovery, bluexp, replicate, replication, cloud storage,
    vmware, kubernetes, trident protect, openshift
  lead: Disaster Recovery in der Cloud ist eine robuste und kostengünstige Methode,
    um Workloads vor Standortausfällen und Datenbeschädigung (z. B. durch Ransomware)
    zu schützen. Mit NetApp Disaster Recovery können Sie Ihre lokalen VMware- und
    Kubernetes-Workloads, die auf ONTAP Storage ausgeführt werden, schützen, indem
    Sie sie an einen Disaster Recovery-Standort replizieren, beispielsweise an einen
    anderen lokalen Standort oder, bei VMware-Workloads, an ein VMware softwaredefiniertes
    Datacenter in einer Public Cloud.
